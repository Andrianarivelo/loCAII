[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "locaii"
version = "0.1.0"
description = "A local AI desktop workbench with durable tasks and economical supervision"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "PySide6>=6.8,<7", "httpx>=0.27,<1", "pypdf>=5,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "Pillow>=11,<13", "jsonschema>=4,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4,<5", "matplotlib>=3.9,<4", "black>=25,<27"]
[project.scripts]
locaii = "locaii.app:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
